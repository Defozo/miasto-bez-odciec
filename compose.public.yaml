services:
  api:
    environment:
      SMART_CITY_PUBLIC_MODE: "true"
      SMART_CITY_ORIGIN: https://${SMART_CITY_DOMAIN:?Set deployment domain}
  worker:
    environment:
      SMART_CITY_PUBLIC_MODE: "true"
      SMART_CITY_ORIGIN: https://${SMART_CITY_DOMAIN:?Set deployment domain}
  proxy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SMART_CITY_DOMAIN: ${SMART_CITY_DOMAIN:?Set deployment domain}
    volumes:
      - ./config/Caddyfile.public:/etc/caddy/Caddyfile:ro
